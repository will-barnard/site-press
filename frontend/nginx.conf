server {
  listen 80;
  root /usr/share/nginx/html;

  # Process-only: Beachhead polls this during deploys.
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }

  location /api/ {
    # Resolve the backend per request through Docker's DNS. A static upstream
    # crashes nginx at boot if the backend isn't up yet; ipv6=off stops the
    # embedded DNS answering AAAA lookups with SERVFAIL.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:3001;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Site and report archives stream through; don't spool them to disk.
    proxy_buffering off;
    proxy_read_timeout 600s;
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
